name: Deploy Resource Site

on:
  push:
    branches: ["main"]
    paths:
      - "resources/**"
      - ".github/workflows/deploy-tencent.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Create deployment package
        run: |
          zip -r deploy_package.zip resources

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy_package.zip"
          target: "/tmp/"
          timeout: 60s
          command_timeout: 10m

      - name: Execute remote commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            release_dir=$(mktemp -d)
            trap 'rm -rf "$release_dir" /tmp/deploy_package.zip' EXIT
            unzip -q /tmp/deploy_package.zip -d "$release_dir"
            test -f "$release_dir/resources/index.html"

            mkdir -p /var/www/ndtool
            if [ -d /var/www/ndtool/resources ]; then
              mv /var/www/ndtool/resources "/var/www/ndtool/resources.bak-ci-$(date +%Y%m%d%H%M%S)"
            fi
            mv "$release_dir/resources" /var/www/ndtool/resources

            nginx -t
            systemctl reload nginx

            curl -fsS https://ndtool.cn/resources/ >/dev/null
